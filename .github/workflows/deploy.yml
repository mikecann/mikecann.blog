name: Deploy

# Builds the site and deploys it to Cloudflare (the mikecann-blog Worker) on every push to main.
# Replaces the Vercel build: see "Build and deploy" in the README for what each step does.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order. A newer push waits rather than cancelling one half way through.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENV: production
      NEXT_PUBLIC_ASSET_BASE_URL: ${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_CONVEX_URL_PROD: ${{ vars.NEXT_PUBLIC_CONVEX_URL_PROD }}
      BLOG_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Builds the site with the production Convex URL, uploads new media to R2, then pushes the
      # Convex functions. Convex only deploys if the build and the upload both succeed.
      - name: Build, sync media to R2 and deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          bunx convex deploy --check-build-environment=disable
          --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
          --cmd 'bun run build && bun run syncAssets'

      - name: Deploy the site to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Update the search index
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          if [ -z "$ALGOLIA_ADMIN_KEY" ]; then
            echo "::warning::ALGOLIA_ADMIN_KEY isn't set, so search won't include new posts"
            exit 0
          fi
          bun run populateAlgolia

      # After the site is live: a new post schedules the subscriber email, which waits until the
      # post's page loads.
      - name: Upload changed posts to Convex
        env:
          BLOG_POST_ADMIN_TOKEN: ${{ secrets.BLOG_POST_ADMIN_TOKEN }}
        run: bun run uploadPostsToConvex -- --production
